name: CI

on:
    pull_request:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    checks:
        name: CI checks
        runs-on: ubuntu-latest
        timeout-minutes: 30
        env:
            CI: 'true'
            NEXT_TELEMETRY_DISABLED: '1'
            TURBO_TELEMETRY_DISABLED: '1'
        steps:
            - name: Check out source
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Node and npm download cache
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: .nvmrc
                  cache: npm
                  cache-dependency-path: |
                      package.json
                      apps/*/package.json
                      packages/*/package.json

            - name: Use the repository npm version
              run: npm install --global "$(node -p "require('./package.json').packageManager")"

            - name: Install dependencies
              run: npm install --no-audit --no-fund

            - name: Restore Turbo cache
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: .turbo/cache
                  key: ${{ runner.os }}-turbo-v1-${{ hashFiles('.nvmrc', 'package.json', 'apps/*/package.json', 'packages/*/package.json', 'turbo.json') }}-${{ github.sha }}
                  restore-keys: |
                      ${{ runner.os }}-turbo-v1-${{ hashFiles('.nvmrc', 'package.json', 'apps/*/package.json', 'packages/*/package.json', 'turbo.json') }}-

            - name: Check formatting
              run: npm run format:check

            - name: Lint
              run: npm run lint

            - name: Typecheck
              run: npm run typecheck

            - name: Unit tests and coverage gates
              run: npm run test:unit

            - name: Release packaging tests
              run: npm run test:release-packaging

            - name: Firefox UAT helper tests
              run: npm run test:firefox-uat-helper

            - name: Build
              run: npm run build

            - name: Bundle guard tests and coverage
              run: npm run test:bundle-checks

            - name: Bundle sizes and API dependencies
              run: npm run check:bundles

            - name: Upload bundle size report
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: bundle-size-report
                  path: artifacts/bundle-report.json

            - name: Install Chromium for product smoke tests
              timeout-minutes: 5
              run: |
                  if [ -f /etc/apt/apt-mirrors.txt ]; then
                      printf 'https://archive.ubuntu.com/ubuntu\n' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
                  fi
                  printf 'Acquire::Retries "1";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/99-ci-timeouts > /dev/null
                  npx playwright install --with-deps chromium

            - name: Product smoke tests
              run: npm run test:product-smoke

            - name: Upload product smoke diagnostics
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: product-smoke-diagnostics
                  path: |
                      apps/vite-playground/playwright-report
                      apps/vite-playground/test-results
                  if-no-files-found: ignore
                  retention-days: 7
